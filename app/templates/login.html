{% extends "base.html" %}
{% block title %}登录 · PetCare{% endblock %}
{% block content %}
<div class="card card-narrow">
  <h2>登录</h2>
  <p class="muted">示例账号：店长 <code>manager / Manager@123</code>；店员 <code>clerk / Clerk@123</code></p>
  <form method="post" action="{{ url_for('auth.login') }}">
    {% if request.args.get('next') %}
      <input type="hidden" name="next" value="{{ request.args.get('next') }}">
    {% endif %}
    <label>登录名
      <input type="text" name="login_name" value="{{ login_name }}" required autofocus autocomplete="username">
    </label>
    <label>密码
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button type="submit" class="btn btn-primary">登录</button>
  </form>
</div>
{% endblock %}
