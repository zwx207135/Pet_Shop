{% extends "base.html" %}
{% block title %}{{ '编辑商品' if product else '新增商品' }}{% endblock %}
{% block content %}
<h2>{{ '编辑商品' if product else '新增商品' }}</h2>
<form method="post" class="card">
  <label>商品名称
    <input type="text" name="product_name" value="{{ form.get('product_name', '') }}" required maxlength="50">
  </label>
  <label>类别
    <input type="text" name="category" value="{{ form.get('category') or '' }}" maxlength="20" placeholder="如：食品 / 用品 / 玩具">
  </label>
  <label>单价（元）
    <input type="number" step="0.01" min="0" name="price" value="{{ form.get('price', '0') }}" required>
  </label>
  <label>预警库存
    <input type="number" min="0" name="stock_warn" value="{{ form.get('stock_warn', 10) }}">
  </label>
  <label>状态
    <select name="status">
      {% for s in statuses %}
        <option value="{{ s }}" {% if (form.get('status') or '在售') == s %}selected{% endif %}>{{ s }}</option>
      {% endfor %}
    </select>
  </label>
  {% if not product %}
  <label>初始库存
    <input type="number" min="0" name="quantity" value="{{ form.get('quantity', 0) }}">
  </label>
  {% endif %}
  <div class="form-actions">
    <button type="submit" class="btn btn-primary">保存</button>
    <a class="btn" href="{{ url_for('products.list') }}">取消</a>
  </div>
</form>
{% endblock %}
